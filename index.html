<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Алёна</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1, #fba2b8);
            font-family: 'Montserrat', 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 5rem;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 8px;
            text-shadow: 0 8px 20px rgba(251, 162, 184, 0.5);
            animation: fadeIn 2.5s ease-in-out infinite alternate;
        }

        /* Декоративное сияющее облако на фоне */
        .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            filter: blur(20px);
            z-index: -1;
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes fadeIn {
            0% {
                transform: scale(0.98);
                opacity: 0.85;
                text-shadow: 0 5px 15px rgba(251, 162, 184, 0.4);
            }
            100% {
                transform: scale(1.02);
                opacity: 1;
                text-shadow: 0 12px 30px rgba(251, 162, 184, 0.8), 0 0 20px rgba(255, 255, 255, 0.6);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="glow"></div>
        <h1>Алёна</h1>
    </div>

</body>
</html>
